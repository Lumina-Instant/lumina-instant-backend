version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lumina-postgres
    restart: unless-stopped
    ports:
      -"5432:5432"
    enviroment:
      -POSTGRES_USER=lumina_user
      -POSTGRES_PASSWORD=lumina_secure_pass
      -POSTGRES_DB=lumina_db
    volumes:
      -pgdata:/var/lib/postgresql/data
  volumes:
      pgdata:

